site_name: TheGrind
site_description: "Coding interview preparation: algorithm solutions in seven languages, lessons, SQL, practical exercises and low-level design"
site_url: https://mhs-20.github.io/TheGrind/
repo_url: https://github.com/MHS-20/TheGrind
docs_dir: site_src

theme:
  name: sorrow

markdown_extensions:
  - tables
  - toc
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - gen-files:
      scripts:
        - site_src/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md

extra_css:
  - extra.css

exclude_docs: |
  gen_pages.py
